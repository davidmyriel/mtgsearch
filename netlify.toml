# Netlify serves the static page in public/ and runs one function, netlify/functions/search.mts.
# Set TOPK_API_KEY in the Netlify UI (Project configuration > Environment variables);
# variables declared in this file are not available to functions.

[build]
  # No build command: the page is plain HTML, CSS and JS, and Netlify bundles the function.
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # topk-js is a native Node add-on, so it is shipped as-is instead of being inlined.
  external_node_modules = ["topk-js"]

# A card's own page, /card/<set>/<number>/<name>, is the same page: its script reads the address.
[[redirects]]
  from = "/card/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://cards.scryfall.io; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
