[project]
name = "mtgsearch"
version = "0.0.1"
description = "Ingest job for mtgsearch: builds the TopK card collection from Scryfall bulk data"
requires-python = ">=3.10"
dependencies = ["topk-sdk>=0.16.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mtgsearch = "mtgsearch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["experiments", "node_modules"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
