[project]
name = "mtgsearch"
version = "0.0.1"
description = "Scryfall-compatible card search with natural-language and art search, built on TopK"
requires-python = ">=3.10"
dependencies = ["topk-sdk>=0.16.1"]

[project.optional-dependencies]
web = ["starlette>=0.37", "uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.6", "starlette>=0.37", "httpx>=0.27"]

[project.scripts]
mtgsearch = "mtgsearch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mtgsearch = ["*.txt", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs TOPK_API_KEY and network access"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
extend-exclude = ["experiments"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
