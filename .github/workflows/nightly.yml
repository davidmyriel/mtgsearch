name: Nightly refresh and regression

# Refreshes the collections from Scryfall's bulk files, then checks that nothing regressed:
# syntax conformance against Scryfall's API, and the relevance evaluation.
on:
  schedule:
    - cron: "17 11 * * *" # Scryfall publishes bulk files around 10:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOPK_API_KEY: ${{ secrets.TOPK_API_KEY }}
      TOPK_REGION: ${{ vars.TOPK_REGION }}
      MTGSEARCH_COLLECTION: ${{ vars.MTGSEARCH_COLLECTION }}
      MTGSEARCH_PRINTINGS_COLLECTION: ${{ vars.MTGSEARCH_PRINTINGS_COLLECTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The job compares today's cards and printings with what the collections already hold,
      # so it needs no cached state: only cards whose text changed are re-embedded, and
      # everything else that moved (rank, prices, new printings) is a field update.
      - name: Ingest changed cards and printings
        if: env.TOPK_API_KEY != ''
        run: |
          pip install -e .
          mtgsearch ingest

      - name: Syntax conformance against Scryfall
        if: env.TOPK_API_KEY != ''
        run: |
          npm ci
          npm run conformance -- conformance/queries.txt --out conformance-results.json
          npm run conformance -- conformance/printings.txt --out conformance-printings-results.json
          npm run conformance -- conformance/mana.txt --out conformance-mana-results.json
          npm run conformance -- conformance/shortcuts.txt --out conformance-shortcuts-results.json
          npm run conformance -- conformance/regex.txt --out conformance-regex-results.json
          npm run conformance -- conformance/names.txt --out conformance-names-results.json
          npm run conformance -- conformance/blocks.txt --out conformance-blocks-results.json
          npm run conformance -- conformance/new.txt --out conformance-new-results.json

      # Held-out sets are never tuned, so the few differences they had when written remain.
      # Each is compared with its saved run: only a query that matched then and does not now
      # fails the job. All four run even if one fails.
      - name: Held-out sets against Scryfall
        if: env.TOPK_API_KEY != ''
        run: |
          status=0
          for set in heldout printings_heldout mana_heldout heldout2; do
            npm run conformance -- "conformance/$set.txt" --baseline "conformance/${set}_results.json" --out "conformance-$set-results.json" || status=1
          done
          exit $status

      - name: Relevance evaluation
        if: env.TOPK_API_KEY != ''
        run: npm run eval -- --out eval-results.json

      - uses: actions/upload-artifact@v4
        if: always() && env.TOPK_API_KEY != ''
        with:
          name: nightly-results
          path: |
            conformance-results.json
            conformance-printings-results.json
            conformance-mana-results.json
            conformance-shortcuts-results.json
            conformance-regex-results.json
            conformance-names-results.json
            conformance-blocks-results.json
            conformance-new-results.json
            conformance-heldout-results.json
            conformance-printings_heldout-results.json
            conformance-mana_heldout-results.json
            conformance-heldout2-results.json
            eval-results.json

      - name: Skipped
        if: env.TOPK_API_KEY == ''
        run: echo "TOPK_API_KEY secret is not configured; nightly refresh skipped."
