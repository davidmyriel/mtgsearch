name: Nightly refresh and regression

# Refreshes the collections from Scryfall's bulk files, then checks that nothing regressed:
# syntax conformance against Scryfall's API, and the relevance evaluation.
on:
  schedule:
    - cron: "17 11 * * *" # Scryfall publishes bulk files around 10:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOPK_API_KEY: ${{ secrets.TOPK_API_KEY }}
      TOPK_REGION: ${{ vars.TOPK_REGION }}
      MTGSEARCH_COLLECTION: ${{ vars.MTGSEARCH_COLLECTION }}
      MTGSEARCH_PRINTINGS_COLLECTION: ${{ vars.MTGSEARCH_PRINTINGS_COLLECTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The job compares today's cards and printings with what the collections already hold,
      # so it needs no cached state: only cards whose text changed are re-embedded, and
      # everything else that moved (rank, prices, new printings) is a field update.
      - name: Ingest changed cards and printings
        if: env.TOPK_API_KEY != ''
        run: |
          pip install -e .
          mtgsearch ingest

      - name: Syntax conformance against Scryfall
        if: env.TOPK_API_KEY != ''
        run: |
          npm ci
          npm run conformance -- conformance/queries.txt --out conformance-results.json
          npm run conformance -- conformance/printings.txt --out conformance-printings-results.json
          npm run conformance -- conformance/mana.txt --out conformance-mana-results.json

      - name: Relevance evaluation
        if: env.TOPK_API_KEY != ''
        run: npm run eval -- --out eval-results.json

      - uses: actions/upload-artifact@v4
        if: always() && env.TOPK_API_KEY != ''
        with:
          name: nightly-results
          path: |
            conformance-results.json
            conformance-printings-results.json
            conformance-mana-results.json
            eval-results.json

      - name: Skipped
        if: env.TOPK_API_KEY == ''
        run: echo "TOPK_API_KEY secret is not configured; nightly refresh skipped."
