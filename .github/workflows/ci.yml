name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Search app (type-check, tests, snapshot, Netlify bundle)
    runs-on: ubuntu-latest
    env:
      # Empty on pull requests from forks; the live tests then skip themselves.
      TOPK_API_KEY: ${{ secrets.TOPK_API_KEY }}
      TOPK_REGION: ${{ vars.TOPK_REGION }}
      MTGSEARCH_COLLECTION: ${{ vars.MTGSEARCH_COLLECTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The compiler snapshot is current
        run: npm run golden -- --check
      - name: Build the function bundle the way Netlify does
        run: |
          npx -y netlify-cli@27 build --offline
          unzip -l .netlify/functions/search.zip | grep -q 'topk-js.*\.node$'

  ingest:
    name: Ingest job (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  e2e:
    name: End-to-end in a browser
    needs: app
    runs-on: ubuntu-latest
    # Secrets are not available to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      TOPK_API_KEY: ${{ secrets.TOPK_API_KEY }}
      TOPK_REGION: ${{ vars.TOPK_REGION }}
      MTGSEARCH_COLLECTION: ${{ vars.MTGSEARCH_COLLECTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright
        if: env.TOPK_API_KEY != ''
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Drive the page at phone and laptop sizes on the local server
        if: env.TOPK_API_KEY != ''
        run: |
          npm run dev > dev-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8000/ && break; sleep 1; done
          node e2e/smoke.cjs http://127.0.0.1:8000 || { cat dev-server.log; exit 1; }
      - name: Drive it again as Netlify serves it
        if: env.TOPK_API_KEY != ''
        run: |
          npx -y netlify-cli@27 dev --offline --port 8899 --no-open > netlify-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8899/ && break; sleep 2; done
          node e2e/smoke.cjs http://127.0.0.1:8899 || { cat netlify-dev.log; exit 1; }
      - name: Skipped
        if: env.TOPK_API_KEY == ''
        run: echo "TOPK_API_KEY secret is not configured; browser test skipped."
